<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>eSIM Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Iconos -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-50 text-gray-800 font-sans h-screen flex overflow-hidden">

    <!-- TOAST NOTIFICATIONS -->
    <div id="toast-container" class="fixed top-5 right-5 z-50 flex flex-col gap-2"></div>

    <!-- VIEW 1: AUTH (LOGIN/REGISTER) -->
    <div id="auth-view" class="w-full h-full flex items-center justify-center bg-gray-900 absolute z-40">
        <div class="bg-white p-8 rounded-xl shadow-2xl w-full max-w-md">
            <div class="text-center mb-8">
                <i class="fa-solid fa-sim-card text-4xl text-blue-600 mb-3"></i>
                <h2 class="text-2xl font-bold text-gray-800">eSIM Portal</h2>
                <p class="text-sm text-gray-500">Friends & Family Edition</p>
            </div>
            
            <form id="auth-form" onsubmit="event.preventDefault();" class="space-y-4">
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Email</label>
                    <input type="email" id="email" class="w-full border-gray-300 rounded-lg p-3 bg-gray-50 focus:ring-2 focus:ring-blue-500 outline-none" required>
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Password</label>
                    <input type="password" id="password" class="w-full border-gray-300 rounded-lg p-3 bg-gray-50 focus:ring-2 focus:ring-blue-500 outline-none" required>
                </div>
                <div class="flex gap-3 pt-4">
                    <!-- AÑADIDO type="button" PARA EVITAR QUE LA PÁGINA RECARGUE -->
                    <button type="button" onclick="login()" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg transition">Login</button>
                    <button type="button" onclick="register()" class="flex-1 bg-gray-200 hover:bg-gray-300 text-gray-800 font-bold py-3 rounded-lg transition">Register</button>
                </div>
            </form>
        </div>
    </div>

    <!-- MAIN LAYOUT (SIDEBAR + CONTENT) -->
    <div id="app-layout" class="hidden w-full h-full flex">
        
        <!-- SIDEBAR -->
        <aside class="w-64 bg-gray-900 text-white flex flex-col h-full shadow-xl">
            <div class="p-6 text-center border-b border-gray-800">
                <i class="fa-solid fa-sim-card text-3xl text-blue-400 mb-2"></i>
                <h1 class="text-xl font-bold">eSIM Portal</h1>
            </div>
            
            <!-- User Nav -->
            <nav id="user-nav" class="flex-1 p-4 space-y-2 hidden">
                <button onclick="switchTab('request-tab')" class="w-full flex items-center gap-3 p-3 rounded-lg hover:bg-gray-800 transition text-left text-sm font-medium"><i class="fa-solid fa-plus w-5"></i> New Request</button>
                <button onclick="switchTab('my-esims-tab')" class="w-full flex items-center gap-3 p-3 rounded-lg hover:bg-gray-800 transition text-left text-sm font-medium"><i class="fa-solid fa-list w-5"></i> My eSIMs</button>
                <button onclick="switchTab('billing-tab')" class="w-full flex items-center gap-3 p-3 rounded-lg hover:bg-gray-800 transition text-left text-sm font-medium"><i class="fa-solid fa-file-invoice-dollar w-5"></i> Billing</button>
            </nav>

            <!-- Admin Nav -->
            <nav id="admin-nav" class="flex-1 p-4 space-y-2 hidden">
                <p class="text-xs text-gray-400 font-bold uppercase tracking-wider mb-3 px-3">Admin Panel</p>
                <button onclick="switchTab('admin-requests-tab')" class="w-full flex items-center gap-3 p-3 rounded-lg hover:bg-gray-800 transition text-left text-sm font-medium"><i class="fa-solid fa-inbox w-5"></i> Pending Requests</button>
                <button onclick="switchTab('admin-billing-tab')" class="w-full flex items-center gap-3 p-3 rounded-lg hover:bg-gray-800 transition text-left text-sm font-medium"><i class="fa-solid fa-calculator w-5"></i> Manage Billing</button>
            </nav>

            <div class="p-4 border-t border-gray-800 text-sm">
                <p class="truncate text-gray-400 mb-3" id="user-display-email"></p>
                <button onclick="logout()" class="w-full bg-red-500/10 text-red-500 hover:bg-red-500 hover:text-white p-2 rounded transition flex justify-center items-center gap-2"><i class="fa-solid fa-right-from-bracket"></i> Logout</button>
            </div>
        </aside>

        <!-- MAIN CONTENT AREA -->
        <main class="flex-1 overflow-y-auto bg-gray-50 p-8">
            
            <!-- TABS -->
            <div id="request-tab" class="tab-content hidden max-w-2xl mx-auto">
                <h2 class="text-3xl font-bold mb-6">Request New eSIM</h2>
                <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                    <form id="esim-form" onsubmit="requestEsim(event)" class="space-y-5">
                        <div class="grid grid-cols-2 gap-5">
                            <div class="col-span-2">
                                <label class="block text-sm font-medium text-gray-700 mb-1">Destination Country/Region</label>
                                <input type="text" id="country" required class="w-full border border-gray-300 rounded p-2 focus:ring-2 focus:ring-blue-500 outline-none">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">Start Date</label>
                                <input type="date" id="start_date" required class="w-full border border-gray-300 rounded p-2">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">End Date</label>
                                <input type="date" id="end_date" required class="w-full border border-gray-300 rounded p-2">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">Data Type</label>
                                <select id="data_type" class="w-full border border-gray-300 rounded p-2">
                                    <option value="total">Total GB (for whole trip)</option>
                                    <option value="daily">GB per Day</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">Amount (GB)</label>
                                <input type="number" id="requested_gb" required min="1" class="w-full border border-gray-300 rounded p-2">
                            </div>
                        </div>
                        <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg transition mt-4">Submit Request</button>
                    </form>
                </div>
            </div>

            <div id="my-esims-tab" class="tab-content hidden">
                <h2 class="text-3xl font-bold mb-6">My eSIMs</h2>
                <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
                    <table class="w-full text-left">
                        <thead class="bg-gray-50 text-gray-600 text-sm">
                            <tr>
                                <th class="p-4 font-medium">Destination</th>
                                <th class="p-4 font-medium">Dates</th>
                                <th class="p-4 font-medium">Plan</th>
                                <th class="p-4 font-medium">Status</th>
                                <th class="p-4 font-medium">Action</th>
                            </tr>
                        </thead>
                        <tbody id="user-requests-list" class="divide-y divide-gray-100 text-sm"></tbody>
                    </table>
                </div>
            </div>

            <div id="billing-tab" class="tab-content hidden max-w-3xl mx-auto">
                <h2 class="text-3xl font-bold mb-6">My Billing History</h2>
                <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
                    <table class="w-full text-left">
                        <thead class="bg-gray-50 text-gray-600 text-sm">
                            <tr>
                                <th class="p-4 font-medium">Month</th>
                                <th class="p-4 font-medium">Used GB</th>
                                <th class="p-4 font-medium text-right">Total Due</th>
                            </tr>
                        </thead>
                        <tbody id="user-billing-list" class="divide-y divide-gray-100 text-sm"></tbody>
                    </table>
                </div>
            </div>

            <!-- ADMIN TABS -->
            <div id="admin-requests-tab" class="tab-content hidden">
                <h2 class="text-3xl font-bold mb-6">Pending Requests</h2>
                <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
                    <table class="w-full text-left">
                        <thead class="bg-gray-50 text-gray-600 text-sm">
                            <tr>
                                <th class="p-4 font-medium">User</th>
                                <th class="p-4 font-medium">Destination</th>
                                <th class="p-4 font-medium">Dates & Plan</th>
                                <th class="p-4 font-medium">Installation Link</th>
                                <th class="p-4 font-medium">Action</th>
                            </tr>
                        </thead>
                        <tbody id="admin-requests-list" class="divide-y divide-gray-100 text-sm"></tbody>
                    </table>
                </div>
            </div>

            <div id="admin-billing-tab" class="tab-content hidden">
                <h2 class="text-3xl font-bold mb-6">Record Monthly Usage</h2>
                <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100 mb-6">
                    <form id="billing-form" onsubmit="addBillingRecord(event)" class="grid grid-cols-1 md:grid-cols-5 gap-4 items-end">
                        <div class="md:col-span-2">
                            <label class="block text-sm font-medium text-gray-700 mb-1">Select Completed Request</label>
                            <select id="bill_request_id" required class="w-full border border-gray-300 rounded p-2 truncate"></select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Month (YYYY-MM)</label>
                            <input type="month" id="bill_month" required class="w-full border border-gray-300 rounded p-2">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Total Cost (€/$)</label>
                            <input type="number" step="0.01" id="bill_cost" required class="w-full border border-gray-300 rounded p-2">
                        </div>
                        <div>
                            <button type="submit" class="w-full bg-purple-600 hover:bg-purple-700 text-white font-bold py-2 rounded transition">Save Bill</button>
                        </div>
                    </form>
                </div>
            </div>

        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
