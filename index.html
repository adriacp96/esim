<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>eSIM Management - Friends</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 font-sans text-gray-800">

    <!-- NAVIGATION BAR -->
    <nav id="navbar" class="bg-blue-600 p-4 text-white hidden flex justify-between items-center">
        <h1 class="text-xl font-bold">eSIM Portal</h1>
        <div class="flex gap-4 items-center">
            <span id="user-email" class="text-sm"></span>
            <button onclick="logout()" class="bg-red-500 hover:bg-red-600 px-3 py-1 rounded text-sm">Logout</button>
        </div>
    </nav>

    <div class="container mx-auto p-4 max-w-5xl mt-6">

        <!-- VIEW 1: LOGIN / REGISTER -->
        <div id="auth-view" class="max-w-md mx-auto bg-white p-6 rounded-lg shadow-md">
            <h2 class="text-2xl font-bold mb-4 text-center">eSIM Access</h2>
            <div class="mb-4">
                <label class="block text-sm font-medium mb-1">Email</label>
                <input type="email" id="email" class="w-full border p-2 rounded" placeholder="friend@email.com">
            </div>
            <div class="mb-4">
                <label class="block text-sm font-medium mb-1">Password</label>
                <input type="password" id="password" class="w-full border p-2 rounded">
            </div>
            <div class="flex gap-2">
                <button onclick="login()" class="w-full bg-blue-600 text-white p-2 rounded hover:bg-blue-700">Login</button>
                <button onclick="register()" class="w-full bg-gray-200 text-gray-800 p-2 rounded hover:bg-gray-300">Register</button>
            </div>
            <p id="auth-error" class="text-red-500 text-sm mt-3 hidden"></p>
        </div>

        <!-- VIEW 2: USER DASHBOARD (FRIENDS) -->
        <div id="user-view" class="hidden space-y-6">
            
            <div class="bg-white p-6 rounded-lg shadow-md">
                <h3 class="text-xl font-bold mb-4 border-b pb-2">Request New eSIM</h3>
                <form id="esim-form" onsubmit="requestEsim(event)" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium">Country / Region</label>
                        <input type="text" id="country" required class="w-full border p-2 rounded" placeholder="e.g., Japan, USA, Europe">
                    </div>
                    <div>
                        <label class="block text-sm font-medium">Data Type</label>
                        <select id="data_type" class="w-full border p-2 rounded">
                            <option value="total">Total GB</option>
                            <option value="daily">GB per Day</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium">Start Date (Min. 24h advance)</label>
                        <input type="date" id="start_date" required class="w-full border p-2 rounded">
                    </div>
                    <div>
                        <label class="block text-sm font-medium">End Date</label>
                        <input type="date" id="end_date" required class="w-full border p-2 rounded">
                    </div>
                    <div>
                        <label class="block text-sm font-medium">Amount of GB</label>
                        <input type="number" id="requested_gb" required min="1" class="w-full border p-2 rounded" placeholder="e.g., 10">
                    </div>
                    <div class="md:col-span-2 flex justify-end">
                        <button type="submit" class="bg-green-600 text-white px-6 py-2 rounded hover:bg-green-700">Request eSIM</button>
                    </div>
                </form>
            </div>

            <div class="bg-white p-6 rounded-lg shadow-md">
                <h3 class="text-xl font-bold mb-4 border-b pb-2">My eSIMs</h3>
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-gray-100">
                                <th class="p-2 border">Country</th>
                                <th class="p-2 border">Dates</th>
                                <th class="p-2 border">Data</th>
                                <th class="p-2 border">Status</th>
                                <th class="p-2 border">Installation</th>
                            </tr>
                        </thead>
                        <tbody id="user-requests-list"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- VIEW 3: ADMIN DASHBOARD (YOU) -->
        <div id="admin-view" class="hidden space-y-6">
            <div class="bg-white p-6 rounded-lg shadow-md border-t-4 border-purple-600">
                <h2 class="text-2xl font-bold mb-4">Admin Panel</h2>
                <h3 class="text-lg font-bold mb-2">Pending Requests</h3>
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse text-sm">
                        <thead>
                            <tr class="bg-gray-100">
                                <th class="p-2 border">Request ID</th>
                                <th class="p-2 border">Country</th>
                                <th class="p-2 border">Dates</th>
                                <th class="p-2 border">GBs</th>
                                <th class="p-2 border">Installation Link/QR</th>
                                <th class="p-2 border">Action</th>
                            </tr>
                        </thead>
                        <tbody id="admin-requests-list"></tbody>
                    </table>
                </div>
            </div>
        </div>

    </div>

    <!-- Main Logic -->
    <script src="app.js"></script>
</body>
</html>
