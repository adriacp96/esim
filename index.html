<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>eSIM Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .dest-card input[type="radio"]:checked + div {
            border-color: #2563eb; background-color: #eff6ff;
            box-shadow: 0 4px 6px -1px rgba(37, 99, 235, 0.1);
        }
        .dest-card input[type="radio"]:checked + div .check-icon { opacity: 1; transform: scale(1); }
        .check-icon { transform: scale(0.5); transition: all 0.2s; }
        
        input[type=range] { -webkit-appearance: none; width: 100%; background: transparent; }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none; height: 28px; width: 28px; border-radius: 50%;
            background: #2563eb; cursor: pointer; margin-top: -10px; box-shadow: 0 2px 6px rgba(37, 99, 235, 0.4);
        }
        input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 8px; background: #e5e7eb; border-radius: 9999px; }
        input[type=range].slider-orange::-webkit-slider-thumb { background: #f97316; box-shadow: 0 2px 6px rgba(249, 115, 22, 0.4); }

        @keyframes popIn { 0% { transform: scale(0.9); opacity: 0.5; } 50% { transform: scale(1.05); } 100% { transform: scale(1); opacity: 1; } }
        .animate-pop { animation: popIn 0.3s forwards; display: inline-block; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans h-screen flex flex-col md:flex-row overflow-hidden selection:bg-blue-100">

    <div id="toast-container" class="fixed top-4 left-4 right-4 md:left-auto md:w-96 z-[9999] flex flex-col gap-2"></div>

    <!-- VIEW 1: AUTH -->
    <div id="auth-view" class="w-full h-full flex items-center justify-center bg-gray-900 absolute z-40 p-4">
        <div class="bg-white p-6 md:p-8 rounded-3xl shadow-2xl w-full max-w-md">
            <div class="text-center mb-6">
                <i class="fa-solid fa-sim-card text-4xl text-blue-600 mb-2"></i>
                <h2 class="text-2xl font-bold text-gray-800">eSIM Portal</h2>
            </div>
            <form id="auth-form" onsubmit="event.preventDefault();" class="space-y-4">
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Email</label>
                    <input type="email" id="email" class="w-full border-gray-300 rounded-xl p-3 bg-gray-50 focus:ring-2 focus:ring-blue-500 outline-none" required>
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Password</label>
                    <input type="password" id="password" class="w-full border-gray-300 rounded-xl p-3 bg-gray-50 focus:ring-2 focus:ring-blue-500 outline-none" required>
                </div>
                <div class="flex gap-2 pt-2">
                    <button type="button" onclick="login()" class="flex-1 bg-blue-600 text-white font-bold py-3 rounded-xl active:scale-95 transition">Login</button>
                    <button type="button" onclick="register()" class="flex-1 bg-gray-200 text-gray-800 font-bold py-3 rounded-xl active:scale-95 transition">Register</button>
                </div>
            </form>
        </div>
    </div>

    <!-- MAIN LAYOUT -->
    <div id="app-layout" class="hidden w-full h-full flex flex-col md:flex-row z-10 relative">
        
        <!-- MOBILE HEADER -->
        <header class="md:hidden bg-gray-900 text-white p-4 flex justify-between items-center shadow-md z-20">
            <div class="flex items-center gap-2 font-bold text-lg"><i class="fa-solid fa-sim-card text-blue-400"></i> eSIM Portal</div>
            <button onclick="logout()" class="text-red-400 text-sm font-bold bg-gray-800 px-3 py-1.5 rounded-lg"><i class="fa-solid fa-power-off"></i></button>
        </header>

        <!-- DESKTOP SIDEBAR -->
        <aside class="hidden md:flex w-64 bg-gray-900 text-white flex-col h-full shadow-xl z-20">
            <div class="p-6 text-center border-b border-gray-800">
                <i class="fa-solid fa-sim-card text-3xl text-blue-400 mb-2"></i>
                <h1 class="text-xl font-bold mt-2">eSIM Portal</h1>
            </div>
            
            <nav id="desktop-user-nav" class="flex-1 p-4 space-y-2 hidden">
                <button onclick="switchTab('request-tab')" class="nav-btn w-full flex items-center gap-3 p-3 rounded-lg hover:bg-gray-800 text-left text-sm font-medium"><i class="fa-solid fa-earth-americas w-5"></i> Get eSIM</button>
                <button onclick="switchTab('my-esims-tab')" class="nav-btn w-full flex items-center gap-3 p-3 rounded-lg hover:bg-gray-800 text-left text-sm font-medium"><i class="fa-solid fa-sim-card w-5"></i> My eSIMs</button>
                <button onclick="switchTab('billing-tab')" class="nav-btn w-full flex items-center gap-3 p-3 rounded-lg hover:bg-gray-800 text-left text-sm font-medium"><i class="fa-solid fa-file-invoice-dollar w-5"></i> Billing</button>
            </nav>

            <nav id="desktop-admin-nav" class="flex-1 p-4 space-y-2 hidden">
                <p class="text-xs text-gray-400 font-bold uppercase tracking-wider mb-3 px-3">Admin Panel</p>
                <button onclick="switchTab('admin-requests-tab')" class="nav-btn w-full flex items-center gap-3 p-3 rounded-lg hover:bg-gray-800 text-left text-sm font-medium"><i class="fa-solid fa-inbox w-5"></i> Manage</button>
                <button onclick="switchTab('admin-history-tab')" class="nav-btn w-full flex items-center gap-3 p-3 rounded-lg hover:bg-gray-800 text-left text-sm font-medium"><i class="fa-solid fa-clock-rotate-left w-5"></i> History</button>
                <button onclick="switchTab('admin-billing-tab')" class="nav-btn w-full flex items-center gap-3 p-3 rounded-lg hover:bg-gray-800 text-left text-sm font-medium"><i class="fa-solid fa-file-invoice w-5"></i> Bills</button>
            </nav>

            <div class="p-4 border-t border-gray-800 text-sm">
                <p class="truncate text-gray-400 mb-3" id="user-display-email"></p>
                <button onclick="logout()" class="w-full bg-red-500/10 text-red-500 hover:bg-red-500 hover:text-white p-2 rounded transition flex justify-center items-center gap-2"><i class="fa-solid fa-right-from-bracket"></i> Logout</button>
            </div>
        </aside>

        <!-- MAIN CONTENT AREA -->
        <main class="flex-1 overflow-y-auto bg-gray-50 p-4 md:p-8 pb-36 md:pb-8 relative">
            
            <!-- REQUEST TAB -->
            <div id="request-tab" class="tab-content hidden max-w-5xl mx-auto">
                <div class="mb-4 md:mb-8">
                    <h2 class="text-2xl md:text-3xl font-bold text-gray-900">Destination</h2>
                    <p class="text-gray-500 text-sm mt-1">Select where you are traveling.</p>
                </div>

                <div class="grid grid-cols-1 lg:grid-cols-3 gap-4 md:gap-8">
                    
                    <div class="lg:col-span-2 space-y-4 md:space-y-8">
                        <!-- Step 1: Destination -->
                        <div class="bg-white p-4 md:p-6 rounded-2xl shadow-sm border border-gray-100">
                            <h3 class="text-base md:text-lg font-bold mb-3 md:mb-4 flex items-center gap-2">Select Region</h3>
                            <div class="grid grid-cols-3 gap-2 md:gap-4 mb-2">
                                <label class="dest-card cursor-pointer">
                                    <input type="radio" name="country_selection" value="Europe" class="sr-only" onclick="updateSummary()">
                                    <div class="border-2 border-gray-200 rounded-xl p-2 md:p-4 text-center relative h-full flex flex-col justify-center bg-white">
                                        <i class="fa-solid fa-earth-europe text-xl md:text-3xl text-gray-400 mb-1 md:mb-2"></i>
                                        <span class="font-bold text-gray-700 text-xs md:text-base">Europe</span>
                                        <i class="fa-solid fa-circle-check check-icon text-blue-600 absolute top-1 right-1 opacity-0"></i>
                                    </div>
                                </label>
                                <label class="dest-card cursor-pointer">
                                    <input type="radio" name="country_selection" value="USA" class="sr-only" onclick="updateSummary()">
                                    <div class="border-2 border-gray-200 rounded-xl p-2 md:p-4 text-center relative h-full flex flex-col justify-center bg-white">
                                        <i class="fa-solid fa-flag-usa text-xl md:text-3xl text-gray-400 mb-1 md:mb-2"></i>
                                        <span class="font-bold text-gray-700 text-xs md:text-base">USA</span>
                                        <i class="fa-solid fa-circle-check check-icon text-blue-600 absolute top-1 right-1 opacity-0"></i>
                                    </div>
                                </label>
                                <label class="dest-card cursor-pointer">
                                    <input type="radio" name="country_selection" value="Japan" class="sr-only" onclick="updateSummary()">
                                    <div class="border-2 border-gray-200 rounded-xl p-2 md:p-4 text-center relative h-full flex flex-col justify-center bg-white">
                                        <i class="fa-solid fa-torii-gate text-xl md:text-3xl text-gray-400 mb-1 md:mb-2"></i>
                                        <span class="font-bold text-gray-700 text-xs md:text-base">Japan</span>
                                        <i class="fa-solid fa-circle-check check-icon text-blue-600 absolute top-1 right-1 opacity-0"></i>
                                    </div>
                                </label>
                                <label class="dest-card cursor-pointer">
                                    <input type="radio" name="country_selection" value="Asia" class="sr-only" onclick="updateSummary()">
                                    <div class="border-2 border-gray-200 rounded-xl p-2 md:p-4 text-center relative h-full flex flex-col justify-center bg-white">
                                        <i class="fa-solid fa-earth-asia text-xl md:text-3xl text-gray-400 mb-1 md:mb-2"></i>
                                        <span class="font-bold text-gray-700 text-xs md:text-base">Asia</span>
                                        <i class="fa-solid fa-circle-check check-icon text-blue-600 absolute top-1 right-1 opacity-0"></i>
                                    </div>
                                </label>
                                <label class="dest-card cursor-pointer">
                                    <input type="radio" name="country_selection" value="Global" class="sr-only" onclick="updateSummary()">
                                    <div class="border-2 border-gray-200 rounded-xl p-2 md:p-4 text-center relative h-full flex flex-col justify-center bg-white">
                                        <i class="fa-solid fa-globe text-xl md:text-3xl text-gray-400 mb-1 md:mb-2"></i>
                                        <span class="font-bold text-gray-700 text-xs md:text-base">Global</span>
                                        <i class="fa-solid fa-circle-check check-icon text-blue-600 absolute top-1 right-1 opacity-0"></i>
                                    </div>
                                </label>
                                <label class="dest-card cursor-pointer">
                                    <input type="radio" name="country_selection" value="custom" class="sr-only" onclick="updateSummary()">
                                    <div class="border-2 border-gray-200 rounded-xl p-2 md:p-4 text-center relative h-full flex flex-col justify-center bg-gray-50">
                                        <i class="fa-solid fa-magnifying-glass text-xl md:text-3xl text-gray-400 mb-1 md:mb-2"></i>
                                        <span class="font-bold text-gray-600 text-xs md:text-base">Other</span>
                                        <i class="fa-solid fa-circle-check check-icon text-blue-600 absolute top-1 right-1 opacity-0"></i>
                                    </div>
                                </label>
                            </div>
                            <div id="custom-country-div" class="hidden mt-2 pt-2 md:mt-4 md:pt-4 border-t border-gray-100">
                                <input type="text" id="custom_country_input" class="w-full border border-gray-300 rounded-lg p-3 outline-none focus:border-blue-500" placeholder="Type country name..." oninput="updateSummary()">
                            </div>
                        </div>

                        <!-- Step 2: Data Package -->
                        <div class="bg-white p-4 md:p-6 rounded-2xl shadow-sm border border-gray-100">
                            <h3 class="text-base md:text-lg font-bold mb-3 flex items-center gap-2">Data Package</h3>
                            
                            <div class="flex bg-gray-100 p-1 rounded-lg mb-6">
                                <button type="button" id="btn_type_total" onclick="setDataType('total')" class="flex-1 py-1.5 text-sm font-bold rounded-md bg-white shadow-sm text-blue-700 transition">Total GB</button>
                                <button type="button" id="btn_type_daily" onclick="setDataType('daily')" class="flex-1 py-1.5 text-sm font-bold rounded-md text-gray-500 transition">GB / Day</button>
                            </div>
                            
                            <div class="px-1">
                                <div class="flex items-end justify-between mb-3">
                                    <div class="text-4xl md:text-5xl font-black text-blue-600 tracking-tighter leading-none" id="slider-val-display">5</div>
                                    <div class="text-gray-400 text-sm md:text-lg font-medium">GB <span id="slider-type-display" class="text-xs md:text-sm">total</span></div>
                                </div>
                                <input type="range" id="gb_slider" min="1" max="50" value="5" oninput="updateSummary()">
                            </div>

                            <div id="days_container" class="hidden mt-6 pt-6 border-t border-gray-100 px-1">
                                <div class="flex items-end justify-between mb-3">
                                    <div class="text-4xl md:text-5xl font-black text-orange-500 tracking-tighter leading-none" id="days-val-display">7</div>
                                    <div class="text-gray-400 text-sm md:text-lg font-medium">Days</div>
                                </div>
                                <input type="range" id="days_slider" min="1" max="30" value="7" class="slider-orange" oninput="updateSummary()">
                            </div>
                        </div>
                    </div>

                    <!-- DESKTOP ORDER SUMMARY -->
                    <div class="hidden lg:block">
                        <div class="bg-gray-900 rounded-2xl shadow-xl text-white sticky top-8">
                            <div class="p-6 border-b border-gray-800 bg-gray-900 z-10 relative">
                                <h3 class="font-bold text-lg">Order Summary</h3>
                            </div>
                            <div class="p-6 space-y-6">
                                <div>
                                    <p class="text-gray-400 text-xs font-bold uppercase tracking-wider mb-2">Destination</p>
                                    <div class="font-bold text-xl flex items-center gap-3">
                                        <i class="fa-solid fa-location-dot text-blue-400"></i> 
                                        <div id="desktop_sum_country" data-val=""><span class="text-gray-500 font-normal">Select region...</span></div>
                                    </div>
                                </div>
                                <div>
                                    <p class="text-gray-400 text-xs font-bold uppercase tracking-wider mb-2">Data Plan</p>
                                    <div class="font-bold text-2xl flex items-center gap-3">
                                        <i class="fa-solid fa-wifi text-blue-400"></i>
                                        <div id="desktop_sum_data" data-val="5 GB (Total)">5 GB <span class="text-sm font-normal text-gray-300">(Total)</span></div>
                                    </div>
                                </div>
                            </div>
                            <div class="p-6 bg-gray-800">
                                <button type="button" onclick="requestEsim()" id="desktop_submit_btn" disabled class="w-full bg-blue-600 disabled:bg-gray-700 disabled:text-gray-500 hover:bg-blue-500 text-white font-bold py-4 rounded-xl transition-all">Request eSIM</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- MY eSIMs TAB (USER) -->
            <div id="my-esims-tab" class="tab-content hidden max-w-5xl mx-auto">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-2xl md:text-3xl font-bold text-gray-900">My eSIMs</h2>
                    <button onclick="loadUserRequests()" class="bg-gray-200 text-gray-700 px-3 py-1.5 rounded-lg text-sm font-bold active:scale-95"><i class="fa-solid fa-rotate-right"></i></button>
                </div>
                <!-- Grid Cards Container -->
                <div id="user-requests-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                    <!-- Cards injected by JS -->
                </div>
            </div>

            <!-- BILLING TAB (USER) -->
            <div id="billing-tab" class="tab-content hidden max-w-5xl mx-auto">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-2xl md:text-3xl font-bold text-gray-900">My Billing</h2>
                </div>
                <!-- Grid Cards Container -->
                <div id="user-billing-list" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                    <!-- Cards injected by JS -->
                </div>
            </div>

            <!-- ADMIN: MANAGE TAB -->
            <div id="admin-requests-tab" class="tab-content hidden max-w-6xl mx-auto">
                <div class="flex items-center justify-between mb-6">
                    <h2 class="text-2xl md:text-3xl font-bold text-purple-900"><i class="fa-solid fa-inbox mr-2"></i> Manage</h2>
                    <button onclick="loadAdminRequests()" class="text-purple-600 bg-purple-100 px-3 py-1.5 rounded-lg text-sm font-bold active:scale-95"><i class="fa-solid fa-rotate-right"></i></button>
                </div>
                
                <!-- Grid Cards Container -->
                <div id="admin-requests-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4">
                    <!-- Cards injected by JS -->
                </div>
            </div>
            
            <!-- ADMIN: HISTORY TAB -->
            <div id="admin-history-tab" class="tab-content hidden max-w-6xl mx-auto">
                <div class="flex items-center justify-between mb-6">
                    <h2 class="text-2xl md:text-3xl font-bold text-gray-900"><i class="fa-solid fa-clock-rotate-left mr-2"></i> History</h2>
                    <button onclick="loadAdminHistory()" class="text-gray-600 bg-gray-200 px-3 py-1.5 rounded-lg text-sm font-bold active:scale-95"><i class="fa-solid fa-rotate-right"></i></button>
                </div>
                <!-- Grid Cards Container -->
                <div id="admin-history-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                    <!-- Cards injected by JS -->
                </div>
            </div>

            <!-- ADMIN: BILLING TAB -->
            <div id="admin-billing-tab" class="tab-content hidden max-w-6xl mx-auto">
                <div class="flex items-center justify-between mb-6">
                    <h2 class="text-2xl md:text-3xl font-bold text-purple-900"><i class="fa-solid fa-file-invoice mr-2"></i> User Bills</h2>
                    <button onclick="loadAdminBilling()" class="text-purple-600 bg-purple-100 px-3 py-1.5 rounded-lg text-sm font-bold active:scale-95"><i class="fa-solid fa-rotate-right"></i></button>
                </div>
                <!-- Grid Cards Container -->
                <div id="admin-billing-records-list" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                    <!-- Cards injected by JS -->
                </div>
            </div>

        </main>

        <!-- MOBILE STICKY SUMMARY (Visible only on Mobile & Request Tab) -->
        <div id="mobile-summary" class="lg:hidden fixed bottom-[65px] left-0 w-full bg-white border-t border-gray-200 p-3 flex justify-between items-center shadow-[0_-4px_10px_-1px_rgba(0,0,0,0.1)] z-40 hidden">
            <div class="flex-1 overflow-hidden pr-2">
                <div id="mob_sum_country" class="font-bold text-gray-800 text-sm truncate" data-val="">Select region</div>
                <div id="mob_sum_data" class="text-gray-500 text-xs font-semibold truncate" data-val="">-</div>
            </div>
            <button type="button" onclick="requestEsim()" id="mob_submit_btn" disabled class="bg-blue-600 disabled:bg-gray-300 disabled:text-gray-500 text-white font-bold px-6 py-3 rounded-xl transition-all text-sm shadow-md active:scale-95 whitespace-nowrap">
                Request
            </button>
        </div>

        <!-- MOBILE BOTTOM NAVIGATION -->
        <nav id="mobile-bottom-nav" class="md:hidden fixed bottom-0 w-full bg-white border-t border-gray-200 flex justify-around items-center z-50 pb-safe shadow-[0_-2px_10px_-1px_rgba(0,0,0,0.05)]">
            <!-- User Nav -->
            <div id="mob-user-nav" class="w-full flex justify-around hidden">
                <button onclick="switchTab('request-tab')" class="mob-nav-btn flex-1 flex flex-col items-center py-2 text-gray-400"><i class="fa-solid fa-earth-americas text-xl mb-1"></i><span class="text-[10px] font-bold">New</span></button>
                <button onclick="switchTab('my-esims-tab')" class="mob-nav-btn flex-1 flex flex-col items-center py-2 text-gray-400"><i class="fa-solid fa-sim-card text-xl mb-1"></i><span class="text-[10px] font-bold">eSIMs</span></button>
                <button onclick="switchTab('billing-tab')" class="mob-nav-btn flex-1 flex flex-col items-center py-2 text-gray-400"><i class="fa-solid fa-file-invoice-dollar text-xl mb-1"></i><span class="text-[10px] font-bold">Billing</span></button>
            </div>
            <!-- Admin Nav -->
            <div id="mob-admin-nav" class="w-full flex justify-around hidden bg-purple-50">
                <button onclick="switchTab('admin-requests-tab')" class="mob-nav-btn flex-1 flex flex-col items-center py-2 text-gray-400"><i class="fa-solid fa-inbox text-xl mb-1"></i><span class="text-[10px] font-bold">Manage</span></button>
                <button onclick="switchTab('admin-history-tab')" class="mob-nav-btn flex-1 flex flex-col items-center py-2 text-gray-400"><i class="fa-solid fa-clock-rotate-left text-xl mb-1"></i><span class="text-[10px] font-bold">History</span></button>
                <button onclick="switchTab('admin-billing-tab')" class="mob-nav-btn flex-1 flex flex-col items-center py-2 text-gray-400"><i class="fa-solid fa-file-invoice text-xl mb-1"></i><span class="text-[10px] font-bold">Bills</span></button>
            </div>
        </nav>

    </div>

    <script src="app.js"></script>
</body>
</html>
